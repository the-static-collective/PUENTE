name: Publish PUENTE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node for unit tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify quest generator and page wiring
        run: |
          node tests/quest-garden.test.cjs
          node tests/puzzle-workshop.test.cjs
          node tests/protocol-game.test.cjs
      - name: Build self-contained offline showcase
        run: node scripts/build-offline.cjs
      - name: Install headless browser for a real human-flow test
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Smoke-test the first impression and teacher handoff
        run: node tests/browser-showcase.cjs
      - name: Upload visual QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puente-showcase-qa
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4